# The single source of the macOS floor version. rustc takes the binary's minos from here;
# crates/bt-gpu/build.rs reads the shaders' -mmacos-version-min from here;
# `make bundle` fills Info.plist's LSMinimumSystemVersion from the binary's minos,
# i.e. indirectly from here.
[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"
