[package]
name = "bt-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bt-core = { workspace = true }
bt-atlas = { workspace = true }
# The renderer. Rationale and feature set in the workspace `Cargo.toml`; no
# platform library is a direct dependency of this crate (`make denetim`): the
# layer and the vsync rhythm come from `bt-shell` (`Surface::from_layer`,
# `Pacer`).
wgpu = { workspace = true }
# The shape of a selection that runs over several lines (`pencere_view::bands`): written once, in
# pencere, and drawn by every host and by the kit's editor alike. A crate of the graph already
# (`bt-shell-common` has it), so nothing new comes in; it is pure geometry and no platform's.
pencere-view = { workspace = true }

[dev-dependencies]
# The glyph guards' sample characters come from the atlas backend's fixture:
# one measurement per font, not a copy here.
bt-atlas = { workspace = true, features = ["fixture"] }
