[package]
name = "bt-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bt-core = { workspace = true }
bt-atlas = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-metal = { workspace = true }
# `CABase` yalnız `CACurrentMediaTime` için: `sessiz=` jetonu display link'in
# damgasıyla aynı zaman tabanını okumak zorunda ve `Instant`'ın tabanı
# belgelenmiş değil. Yeni bağımlılık değil, mevcut paketin bir özelliği.
objc2-quartz-core = { workspace = true, features = ["CABase", "CALayer", "CAMetalLayer", "CAMetalDisplayLink", "objc2-metal", "objc2-core-foundation"] }
dispatch2 = { workspace = true }
block2 = { workspace = true }
