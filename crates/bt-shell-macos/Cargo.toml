[package]
name = "bt-shell-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bt-gpu = { workspace = true }
# Direct edge (downward, consistent with the layer order): the default
# background color is solely owned by `bt-core`'s palette, so the color does
# not live in two places.
bt-core = { workspace = true }
# The platform-independent half of the shell layer: settings, split
# tree, zoom, notices, gesture, quote, keys, upload, jobs, child, watch.
bt-shell-common = { workspace = true }
objc2 = { workspace = true }
# performSelector:withObject:afterDelay: needs NSRunLoop + NSDate; the default
# set is on today, this line protects it if it gets trimmed. NSLocale: the
# shell's locale (`locale::system_locale`) — not a new crate, a flag of an
# existing dependency. The protection is **incomplete**: the methods
# used (`regionCode`, `preferredLanguages`) also need NSString and
# NSArray. Both are in the default set and the crate uses them elsewhere
# without a feature list (`ns_string!`, `NSArray`); they enter here the day
# of trimming.
# NSURL: the file URL of "Settings…"; `NSWorkspace` pulls it in
# too, but this crate is the one that uses it.
# NSKeyValueObserving: watching the app's effective appearance —
# once the window gets the theme's appearance, the view no longer sees the
# system's light/dark change, while `NSApp.effectiveAppearance` can be
# observed with KVO.
# NSUUID: the tab's persistent id (`window::new_tab_id`) —
# `TERM_SESSION_ID` and `bateri://tab/<id>`. Only a header flag, not a new
# crate; `Cargo.lock` did not move.
# NSDateFormatter (with its superclass's NSFormatter): the scroll bar block
# tip's time of day in the user's short time style. Only header flags of the
# default set, written here for the day of trimming; `Cargo.lock` did not move.
objc2-foundation = { workspace = true, features = [
    "NSRunLoop", "NSDate", "NSLocale", "NSURL", "NSKeyValueObserving", "NSUUID",
    "NSDateFormatter", "NSFormatter",
] }
# NSAppearance: the system's light/dark appearance. NSMenu and
# NSMenuItem: the main menu; NSWorkspace: "Settings…" opening the file in the
# editor. NSCell: the type of the check mark in Theme ▸
# (`NSControlStateValue`). NSAccessibility: the system's Reduce
# Motion setting and its change notification (`observe_reduce_motion`);
# both are in the category of `NSWorkspace` that comes with this
# flag. NSTextInputClient: the keyboard's text path goes through AppKit's
# stack (`view::BateriView`) — the protocol's name and its 11
# required methods are behind that flag. NSDragging: the view is now a drag
# target (`view::BateriView`) — `NSDraggingDestination`,
# `NSDraggingInfo` and `NSDragOperation` are behind that flag; **all** of the
# protocol's methods are `#[optional]`, so implementing two is enough.
# NSColor: the window chrome's background comes from the theme's `background`
# (`window::TerminalWindow::apply_chrome`).
# NSWindowTabGroup: the tab group's windows (⇧⌘W, ⌘1…⌘9) —
# `tabbedWindows` gives `nil` while the bar is not showing. It pulls in only
# the NSArray/NSString headers, both already on; `Cargo.lock` did not move.
# `NSPasteboardTypeFileURL` and `readObjectsForClasses:options:` do **not**
# need a flag here: both are inside the `NSPasteboard` header that the
# workspace manifest turns on (this line does not trim that set) and the
# reading path is deliberately that API — `pasteboardItems()` would need the
# `NSPasteboardItem` flag. Not a new crate, flags of an existing dependency;
# `Cargo.lock` does not record flags.
#
# `NSUserDefaults` on the same path needs **no flag**: `registerDefaults`
# (`app`: `ApplePressAndHoldEnabled`) is in `objc2-foundation`'s default set
# and the list above does not trim that set, it adds to it. On the day of
# trimming this line will be looked up; this comment is the record.
#
# NSAlert, NSButton, NSControl, block2: the close confirmation's question.
# `addButtonWithTitle:` returns `NSButton` and that is a
# subclass of `NSControl`, so both are preconditions of `NSAlert`; the
# `block2` flag opens the signature of the sheet's
# (`beginSheetModalForWindow:completionHandler:`) completion block. Not a new
# crate and no version moves; in `Cargo.lock`, one `block2` line each in the
# lists of this package and of `bt-shell-macos`.
#
# Settings window: the sidebar (`NSSplitViewController`,
# `NSSplitViewItem`, `NSSplitView`, `NSViewController`, `NSTableView`,
# `NSTableColumn`, `NSTableCellView`, `NSScrollView`, `NSClipView`,
# `NSImage`, `NSImageView`, `NSTableHeaderView` — a headerless table,
# `NSUserInterfaceItemIdentification` — the column's identity), the rows
# (`NSGridView`, `NSStackView`, `NSTextField`, `NSPopUpButton`, `NSSlider`,
# `NSStepper`, `NSSwitch`, `NSFont`, `NSFontDescriptor` — the value label's
# fixed-width digits, `NSText`) and the layout (`NSLayoutConstraint`,
# `NSLayoutAnchor`, `NSLayoutGuide` — below the title bar,
# `NSUserInterfaceLayout`) and the broken-file strip (`NSBox`). All
# are `objc2-app-kit` flags that only open headers — as dependencies they want
# only `objc2-foundation`'s headers and the `bitflags` already in the graph;
# not a new crate, `Cargo.lock` did not move.
# Search panel: `NSSearchField` and the cell chain
# (`NSSearchFieldCell` → `NSTextFieldCell` → `NSActionCell`), the type and
# frame of the toggle and arrow buttons (`NSButtonCell`), the surface's shadow
# (`NSShadow`; the background and edge are `NSBox`'s, the layer path that
# wants `CGColor` would add an `objc2-core-graphics` edge) and the
# open/close animation (`NSAnimationContext`, `animator()` is in the
# `NSAnimation` header). Only header flags; `Cargo.lock` did not move.
# The tab's dot: `NSWindowTab` (`window.tab()` and
# `setAccessoryView`); only a header flag, `Cargo.lock` did not move.
# Progress of the remote upload in the Dock icon:
# `NSDockTile` (`NSApp.dockTile`, the content view) and `NSProgressIndicator`
# (the bar). Only header flags; `Cargo.lock` did not move.
# The hand cursor of the upload buttons: `NSCursor`
# (`pointingHandCursor`, given to the view's cursor rect). Only a header
# flag; `Cargo.lock` did not move.
# The upload queue's popover: `NSPopover` (and its delegate)
# and shortening a long name in the middle (`NSParagraphStyle`:
# `NSLineBreakMode`). Only header flags; `Cargo.lock` did not move.
# "Download To…" of a remote link: `NSOpenPanel` (and its
# `NSSavePanel`/`NSPanel` chain) picks the destination folder as a sheet. Only
# header flags over `objc2-foundation` headers; `Cargo.lock` did not move.
# ⌘-dragging a remote link to Finder: `NSFilePromiseProvider`
# (and its delegate protocol), `NSDraggingItem` and `NSDraggingSession` for
# `beginDraggingSessionWithItems:event:source:`. Only header flags over
# `objc2-foundation` headers already in its default set; `Cargo.lock` did not
# move.
# The ssh master's password sheet: `NSSecureTextField` as the
# alert's accessory. Only a header flag; `Cargo.lock` did not move.
# Session restore: `NSScreen` (`screens`, `visibleFrame`) clamps a
# saved window frame onto a visible screen, `NSWindowRestoration`
# (`setRestorable`) keeps AppKit's own restoration off. Only header flags over
# `objc2-foundation` headers; `Cargo.lock` did not move.
# The scroll bar's "system" form: `NSScroller` (`preferredScrollerStyle` and
# its change notification). Only a header flag; `Cargo.lock` did not move.
# The pointer over the scroll bar's strip: `NSTrackingArea` (entered, exited
# and moved, in an unfocused pane too). Only a header flag over
# `objc2-foundation` headers already in its set; `Cargo.lock` did not move.
# "Jump to latest"'s two-tone title: `NSAttributedString` for AppKit's
# attribute keys (`NSForegroundColorAttributeName`, `NSFontAttributeName`).
# Only a header flag over `objc2-foundation` headers and the `bitflags`
# already in the graph; `Cargo.lock` did not move.
objc2-app-kit = { workspace = true, features = [
    "NSAccessibility", "NSAlert", "NSAppearance", "NSBox", "NSButton", "NSCell", "NSClipView",
    "NSColor", "NSControl", "NSDragging", "NSFont", "NSFontDescriptor", "NSGridView", "NSImage",
    "NSImageView", "NSLayoutAnchor", "NSLayoutConstraint", "NSLayoutGuide", "NSMenu", "NSMenuItem",
    "NSPopUpButton", "NSScrollView", "NSSlider", "NSSplitView", "NSSplitViewController",
    "NSSplitViewItem", "NSStackView", "NSStepper", "NSSwitch", "NSTableCellView",
    "NSTableColumn", "NSTableHeaderView", "NSTableView", "NSText", "NSTextField",
    "NSTextInputClient", "NSUserInterfaceItemIdentification", "NSUserInterfaceLayout", "NSViewController", "NSWindowTabGroup", "NSWorkspace",
    "NSActionCell", "NSAnimation", "NSAnimationContext", "NSButtonCell", "NSSearchField",
    "NSSearchFieldCell",
    "NSShadow", "NSTextFieldCell", "NSWindowTab", "block2", "NSDockTile", "NSProgressIndicator",
    "NSCursor", "NSPopover", "NSParagraphStyle", "NSOpenPanel", "NSPanel", "NSSavePanel",
    "NSDraggingItem", "NSDraggingSession", "NSFilePromiseProvider", "NSSecureTextField",
    "NSScreen", "NSWindowRestoration", "NSScroller", "NSTrackingArea", "NSAttributedString",
] }
# Only for the CALayer type: NSView::setLayer(Option<&CALayer>) wants it.
# The layer rules record this as "only attaching a CALayer".
# `CAMediaTimingFunction`: the curve of the search panel's appearance — the
# argument of `NSAnimationContext::setTimingFunction`; only a
# header flag.
# The pane owns the terminal view's `CAMetalLayer` (wgpu draws
# into it) and the vsync rhythm is `NSView.displayLink` — a `CADisplayLink`
# used as a timer — with `CACurrentMediaTime` as its time base (`CABase`;
# `objc2-core-foundation` for the `CFTimeInterval` stamps). Header features
# of an existing dependency; wgpu already enables the same ones in the graph.
objc2-quartz-core = { workspace = true, features = [
    "CABase", "CADisplayLink", "CALayer", "CAMediaTimingFunction", "CAMetalLayer",
    "objc2-core-foundation",
] }
# The upload's notification: `UNUserNotificationCenter`. A new crate,
# user-approved; the rationale for the flags is in the workspace manifest.
objc2-user-notifications = { workspace = true }
# The Keychain of the ssh masters' passwords (`keychain`): a new
# crate, user-approved (2026-10-02); the rationale is in the workspace manifest.
# `objc2-core-foundation`'s flags are the query's own types: the dictionary,
# its string keys, the password's bytes and the port's number.
objc2-security = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["CFData", "CFNumber"] }
# The main queue: `Wake::child_exit` arrives on the reader thread and
# `terminate:` is the main thread's job. The settings watch
# (`bt_shell_common::watch`) notifies on the shared crate's own
# serial queue; `app::watch_notify` carries the event to the main queue.
dispatch2 = { workspace = true }
# The close confirmation sheet's completion block (`RcBlock`).
block2 = { workspace = true }
# The watchdog thread's `write` + `_exit`. The process table (`jobs`), the
# passwd entry (`child`) and the watch's `O_EVTONLY` moved to `bt-shell-common`.
# The rationale is in the workspace manifest.
libc = { workspace = true }

[dev-dependencies]
# The shared crate's test helpers (`TempRoot`, `SilentWake`, `wait_until`)
# for this crate's tests (`bt-atlas`'s `fixture` precedent).
bt-shell-common = { workspace = true, features = ["test-support"] }
