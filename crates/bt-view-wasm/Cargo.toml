[package]
name = "bt-view-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The page engine: the tree a module hands out is read into its elements, and what the module
# is asked of the page laid out is answered from its layout. No other crate of this workspace,
# no platform library (`make audit`) — the sandbox moves out of the workspace with the engine.
bt-view = { path = "../bt-view" }
wasmtime = { workspace = true }

[dev-dependencies]
# Modules written as text for the sandbox's tests (`.wat`), so that `make check` does not need
# the toolchain that builds a real one.
wasmtime = { workspace = true, features = ["wat"] }
