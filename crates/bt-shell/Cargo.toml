[package]
name = "bt-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bt-gpu = { workspace = true }
# Doğrudan kenar (aşağı yönlü, katman düzenine uygun): varsayılan arka plan
# rengi `bt-core`'un paletinde tek sahiplidir. 002 phase-3 Session için zaten
# ekliyordu; renk iki yerde durmasın diye phase-1'de eklendi.
bt-core = { workspace = true }
objc2 = { workspace = true }
# performSelector:withObject:afterDelay: NSRunLoop + NSDate ister; varsayılan
# set bugün açık, kırpılırsa bu satır onu korur. NSLocale: kabuğun yereli
# (`child::locale_env`, 006 phase-4b) — yeni crate değil, var olan
# bağımlılığın bayrağı; karar kaydı .tasks/006-gunluk-kullanim-esigi/
# discussion.md → Karar 6 eki. Koruma **eksik**: kullanılan yöntemler
# (`regionCode`, `preferredLanguages`) ayrıca NSString ve
# NSArray ister. İkisi varsayılan sette ve crate onları başka yerlerde de
# listesiz kullanıyor (`ns_string!`, `NSArray`); kırpma günü buraya girerler.
# NSURL: "Settings…"ın dosya URL'si (007 phase-6); `NSWorkspace` de çekiyor,
# ama kullanan bu crate.
# NSKeyValueObserving: uygulamanın etkin görünümünü izlemek (026 phase-4) —
# pencereye temanın görünümü kurulunca view sistemin açık/koyu değişimini
# artık görmüyor, `NSApp.effectiveAppearance` ise KVO ile izlenebilir.
objc2-foundation = { workspace = true, features = [
    "NSRunLoop", "NSDate", "NSLocale", "NSURL", "NSKeyValueObserving",
] }
# NSAppearance: sistemin açık/koyu görünümü (007 phase-3). NSMenu ve
# NSMenuItem: ana menü; NSWorkspace: "Settings…"ın dosyayı editörde açması
# (007 phase-6). NSCell: Theme ▸'deki işaretin tipi (`NSControlStateValue`,
# 007 phase-7). NSAccessibility: sistemin Hareketi Azalt ayarı ve onun değişim
# bildirimi (`observe_reduce_motion`, 008 phase-5); ikisi de `NSWorkspace`'in
# bu bayrakla gelen kategorisinde. NSTextInputClient: klavyenin metin yolu
# AppKit'in yığınından geçiyor (`view::BateriView`, 018 phase-1) — protokolün
# adı ve 11 zorunlu metodu o bayrağın arkasında. NSDragging: view artık bir
# sürükleme hedefi (`view::BateriView`, 018 phase-3) — `NSDraggingDestination`,
# `NSDraggingInfo` ve `NSDragOperation` o bayrağın arkasında; protokolün
# **bütün** metotları `#[optional]`, yani ikisini uygulamak yetiyor.
# NSColor: pencere kromunun zemini temanın `background`'ından
# (`window::TerminalWindow::apply_chrome`, 026 phase-4).
# NSWindowTabGroup: sekme grubunun pencereleri (⇧⌘W, ⌘1…⌘9; 026 phase-3) —
# `tabbedWindows` çubuk görünmüyorken `nil` veriyor. Yalnız NSArray/NSString
# başlıklarını çekiyor, ikisi zaten açık; `Cargo.lock` oynamadı.
# `NSPasteboardTypeFileURL` ve `readObjectsForClasses:options:` burada bir
# bayrak **istemiyor**: ikisi de workspace manifest'inin açtığı
# `NSPasteboard` başlığının içinde (bu satır o seti kırpmıyor) ve okuma yolu
# bilerek o API — `pasteboardItems()` `NSPasteboardItem` bayrağını isterdi.
# Yeni crate değil, var olan bağımlılığın bayrakları; `Cargo.lock` bayrak
# kaydetmiyor.
#
# Aynı yolun `NSUserDefaults`'ı **bayrak istemiyor**: `registerDefaults`
# (`app`: `ApplePressAndHoldEnabled`) `objc2-foundation`'ın varsayılan
# setinde ve yukarıdaki liste o seti kırpmıyor, ekliyor. Kırpma günü bu satır
# aranacak; kaydı bu yorum.
#
# NSAlert, NSButton, NSControl, block2: kapatma onayının sorusu (028 phase-2).
# `addButtonWithTitle:` `NSButton` döndürüyor ve o `NSControl`'ün alt sınıfı,
# yani ikisi `NSAlert`'in ön koşulu; `block2` bayrağı sayfanın
# (`beginSheetModalForWindow:completionHandler:`) tamamlanma bloğunun imzasını
# açıyor. Yeni crate değil ve sürüm oynamıyor; `Cargo.lock`'ta bu paketin ve
# `bt-shell`'in listelerine birer `block2` satırı. Karar kaydı
# .tasks/028-kapatma-onayi/discussion.md → Karar 2.
#
# Ayar penceresi (029 phase-2): kenar çubuğu (`NSSplitViewController`,
# `NSSplitViewItem`, `NSSplitView`, `NSViewController`, `NSTableView`,
# `NSTableColumn`, `NSTableCellView`, `NSScrollView`, `NSClipView`,
# `NSImage`, `NSImageView`, `NSTableHeaderView` — başlıksız tablo,
# `NSUserInterfaceItemIdentification` — sütunun kimliği), satırlar
# (`NSGridView`, `NSStackView`, `NSTextField`, `NSPopUpButton`, `NSSlider`,
# `NSStepper`, `NSSwitch`, `NSFont`, `NSFontDescriptor` — değer etiketinin
# sabit genişlikli rakamları, `NSText`) ve yerleşim (`NSLayoutConstraint`, `NSLayoutAnchor`,
# `NSLayoutGuide` — başlık çubuğunun altı, `NSUserInterfaceLayout`) ve bozuk
# dosyanın şeridi (`NSBox`, phase-3). Hepsi `objc2-app-kit`'in yalnız başlık açan
# bayrakları — bağımlılık olarak yalnız `objc2-foundation`'ın başlıklarını ve
# grafta zaten olan `bitflags`'i istiyorlar; yeni crate değil, `Cargo.lock`
# oynamadı. Karar kaydı .tasks/029-ayarlar-penceresi/discussion.md → Karar 4.
# Arama paneli (033 phase-4): `NSSearchField` ve hücre zinciri
# (`NSSearchFieldCell` → `NSTextFieldCell` → `NSActionCell`), anahtar ve ok
# düğmelerinin tipi ve çerçevesi (`NSButtonCell`), yüzeyin gölgesi
# (`NSShadow`; zemin ve kenar `NSBox`'ın, `CGColor` isteyen katman yolu
# `objc2-core-graphics` kenarı eklerdi) ve açılış/kapanış animasyonu
# (`NSAnimationContext`, `animator()` `NSAnimation` başlığında). Yalnız
# başlık bayrakları; `Cargo.lock` oynamadı. Karar kaydı
# .tasks/033-gecmiste-arama/discussion.md → Karar.
# Sekmenin noktası (037 phase-2): `NSWindowTab` (`window.tab()` ve
# `setAccessoryView`); yalnız başlık bayrağı, `Cargo.lock` oynamadı. Karar
# kaydı .tasks/037-ssh-ikinci-tur/discussion.md → Karar 4.
# Uzak dizine yüklemenin Dock simgesindeki ilerlemesi (037 phase-5):
# `NSDockTile` (`NSApp.dockTile`, içerik view'ı) ve `NSProgressIndicator`
# (çubuk). Yalnız başlık bayrakları; `Cargo.lock` oynamadı. Karar kaydı
# .tasks/037-ssh-ikinci-tur/discussion.md → Karar 7 → Kullanıcı kararı 4.
objc2-app-kit = { workspace = true, features = [
    "NSAccessibility", "NSAlert", "NSAppearance", "NSBox", "NSButton", "NSCell", "NSClipView",
    "NSColor", "NSControl", "NSDragging", "NSFont", "NSFontDescriptor", "NSGridView", "NSImage",
    "NSImageView", "NSLayoutAnchor", "NSLayoutConstraint", "NSLayoutGuide", "NSMenu", "NSMenuItem",
    "NSPopUpButton", "NSScrollView", "NSSlider", "NSSplitView", "NSSplitViewController",
    "NSSplitViewItem", "NSStackView", "NSStepper", "NSSwitch", "NSTableCellView",
    "NSTableColumn", "NSTableHeaderView", "NSTableView", "NSText", "NSTextField",
    "NSTextInputClient", "NSUserInterfaceItemIdentification", "NSUserInterfaceLayout", "NSViewController", "NSWindowTabGroup", "NSWorkspace",
    "NSActionCell", "NSAnimation", "NSAnimationContext", "NSButtonCell", "NSSearchField",
    "NSSearchFieldCell",
    "NSShadow", "NSTextFieldCell", "NSWindowTab", "block2", "NSDockTile", "NSProgressIndicator",
] }
# Yalnız CALayer tipi için: NSView::setLayer(Option<&CALayer>) ister.
# Katman tablosu (CLAUDE.md) bunu "yalnız CALayer takma" diye kayda aldı.
# `CAMediaTimingFunction`: arama panelinin belirmesinin eğrisi (033
# phase-4) — `NSAnimationContext::setTimingFunction`'ın argümanı; yalnız
# başlık bayrağı.
objc2-quartz-core = { workspace = true, features = ["CALayer", "CAMediaTimingFunction"] }
# Ana kuyruk: `Wake::child_exit` okuyucu thread'de gelir ve `terminate:` ana
# thread'in işidir. Grafta bt-gpu üzerinden zaten vardı; bu iki satır yeni
# crate çekmez, `Cargo.lock`'a yalnız kenar ekler. Vnode kaynakları da buradan
# (ayar ve tema dosyasının izlenmesi, `watch`, 007 phase-4): fonksiyon
# işaretçili işleyiciyle, blok değil.
dispatch2 = { workspace = true }
# Kapatma onayı sayfasının tamamlanma bloğu (`RcBlock`, 028 phase-2). Grafta
# `bt-gpu` ve `dispatch2` üzerinden zaten vardı; bu satır yalnız kenar ekler,
# sürüm oynamaz. Karar kaydı .tasks/028-kapatma-onayi/discussion.md → Karar 2.
block2 = { workspace = true }
# Bekçi thread'in `write` + `_exit`'i, izleme kaynaklarının `O_EVTONLY`'si
# (`watch`, 007 kapı) ve kabuğun passwd kaydı (`child::passwd_shell`,
# `getpwuid_r`, 009 phase-3: Dock'tan açılışta `$SHELL` yok ve alacritty de
# aynı sıraya düşüyor) ve kabuğun ön planında koşan işin tespiti (`jobs`,
# `proc_pidinfo`/`proc_listchildpids`/`proc_listpgrppids`/`proc_name`, 028
# phase-1: Apple'ın `libproc` yarısı, yeni bayrak ya da crate değil).
# Gerekçesi workspace manifest'inde.
libc = { workspace = true }
