[package]
name = "bt-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bt-gpu = { workspace = true }
# Doğrudan kenar (aşağı yönlü, katman düzenine uygun): varsayılan arka plan
# rengi `bt-core`'un paletinde tek sahiplidir. 002 phase-3 Session için zaten
# ekliyordu; renk iki yerde durmasın diye phase-1'de eklendi.
bt-core = { workspace = true }
objc2 = { workspace = true }
# performSelector:withObject:afterDelay: NSRunLoop + NSDate ister; varsayılan
# set bugün açık, kırpılırsa bu satır onu korur. NSLocale: kabuğun yereli
# (`child::locale_env`, 006 phase-4b) — yeni crate değil, var olan
# bağımlılığın bayrağı; karar kaydı .tasks/006-gunluk-kullanim-esigi/
# discussion.md → Karar 6 eki. Koruma **eksik**: kullanılan yöntemler
# (`regionCode`, `preferredLanguages`) ayrıca NSString ve
# NSArray ister. İkisi varsayılan sette ve crate onları başka yerlerde de
# listesiz kullanıyor (`ns_string!`, `NSArray`); kırpma günü buraya girerler.
objc2-foundation = { workspace = true, features = ["NSRunLoop", "NSDate", "NSLocale"] }
# NSAppearance: sistemin açık/koyu görünümü (007 phase-3). Yeni crate değil,
# var olan bağımlılığın bayrağı; `Cargo.lock` bayrak kaydetmiyor.
objc2-app-kit = { workspace = true, features = ["NSAppearance"] }
# Yalnız CALayer tipi için: NSView::setLayer(Option<&CALayer>) ister.
# Katman tablosu (CLAUDE.md) bunu "yalnız CALayer takma" diye kayda aldı.
objc2-quartz-core = { workspace = true, features = ["CALayer"] }
# Ana kuyruk: `Wake::child_exit` okuyucu thread'de gelir ve `terminate:` ana
# thread'in işidir. Grafta bt-gpu üzerinden zaten vardı; bu iki satır yeni
# crate çekmez, `Cargo.lock`'a yalnız kenar ekler. Vnode kaynakları da buradan
# (ayar ve tema dosyasının izlenmesi, `watch`, 007 phase-4): fonksiyon
# işaretçili işleyiciyle, `block2` kenarı yok.
dispatch2 = { workspace = true }
# Yalnız bekçi thread'in `write` + `_exit`'i; gerekçesi workspace manifest'inde.
libc = { workspace = true }
