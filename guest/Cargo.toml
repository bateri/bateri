# The page modules: the pages that run in bateri's sandbox (`crates/bt-view-wasm`), written with
# the SDK. Another workspace on purpose — these are built for `wasm32-unknown-unknown` with the
# rustup `stable` toolchain (`make guest`), while the application is built with the toolchain the
# host workspace pins; `make check` never builds them, so it needs no WebAssembly toolchain.
[workspace]
resolver = "3"
members = ["sdk", "messages", "containers", "broken", "chatty", "componentize", "demopen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# The page engine's builder language (`div().row().gap(8.0)`): the style language of a page is
# the engine's own, not a copy of it.
bt-view = { path = "../crates/bt-view" }
bateri-view-sdk = { path = "sdk" }
# What a program and its view say to each other (`messages`), written once for both halves.
bateri-view-messages = { path = "messages" }
# The wire the program half of a view speaks: frames, bundles, digests. Its host half is the
# terminal's; the program uses the same crate to write what the terminal reads.
pencere = { git = "https://github.com/bateri/pencere", rev = "e4e3566cc721633f5debd517e3a59fb6591b208c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The bindings of the interface in `crates/bt-view-wasm/wit`, and the tool that turns a module
# that uses them into a component. Versions of the era of the runtime the host links.
wit-bindgen = { version = "=0.46.0", default-features = false, features = ["macros", "realloc"] }
wit-component = "=0.239.0"

[profile.release]
# Small and fast to compile for the runtime (its Cranelift compile time grows with the module);
# a panic is a trap, not an unwinding (nothing could catch it in the sandbox anyway).
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
