[workspace]
resolver = "3"
members = [
    "crates/bt-core",
    "crates/bt-atlas",
    "crates/bt-gpu",
    "crates/bt-shell-common",
    "crates/bt-shell-macos",
    "crates/bateri",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

# Dış crate sürümleri tek yerden; üyeler `{ workspace = true }` der.
[workspace.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
# Framework crate'leri varsayılanda her başlığı açar; kullanılanlar sayılır.
# Üye başına `default-features = false` mirası ezemediği için kırpma burada.
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSGraphics",
    "NSRunningApplication", "NSEvent", "NSPasteboard", "objc2-core-foundation",
    "objc2-quartz-core",
] }
# Glyph rasterizasyonu (`bt-atlas`): CTFont metriği + alfa-only bitmap bağlamı.
# Kullanıcı onaylı bağımlılık kararı: .tasks/003-glyph-atlas/discussion.md →
# Karar. Servo ailesi (`core-text` 22) reddedildi: ikinci bir CF sarmalayıcı
# yığını `Cargo.lock`'a girerdi, workspace zaten objc2 ailesini pinliyor.
# `CTFontDescriptor` süs değil — `CTFontGetAdvancesForGlyphs` yönelim tipini
# (`CTFontOrientation`) oradan alıyor ve o feature olmadan derlenmiyor.
objc2-core-text = { version = "0.3", default-features = false, features = [
    "std", "CTFont", "CTFontDescriptor", "CTFontTraits", "objc2-core-graphics",
# `CTFontTraits` da süs değil: `CTFontSymbolicTraits` tipi ve onunla çalışan
# `copy_with_symbolic_traits` / `symbolic_traits` kapıları o feature'ın
# arkasında. Dört font yüzü (kalın, eğik, kalın-eğik) onlarsız türetilemiyor.
# `CTLine` + `CTRun` grapheme dizisini (bayrak, ZWJ, ten rengi, VS16) tek
# glyph'e şekillendiriyor — `CTFontGetGlyphsForCharacters` kod noktası başına
# bakıyor, diziyi birleştirmiyor. `CTStringAttributes` `kCTFontAttributeName`
# için: satırın fontu attributed string'e onunla veriliyor ve run'ın gerçekten
# kullandığı font onunla okunuyor (.tasks/035-grapheme-dizileri, phase-1).
    "CTLine", "CTRun", "CTStringAttributes",
] }
# `CGBitmapContextCreate` dört başlığın kesişiminde (kendi `CGBitmapContext`
# başlığı + `CGColorSpace` + `CGContext` + `CGImage`), `CGFont` ise `CGGlyph`
# tipi için. Varsayılan feature seti `objc2-io-surface`'i de çekiyordu;
# kırpma onu grafın dışında tutuyor.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGFont", "CGImage",
] }
# Yeni bir crate DEĞİL — grafta zaten vardı (objc2-app-kit çekiyor) ve sürüm
# oynamıyor; `Cargo.lock`'ta yalnız `bt-atlas`'ın listesine kenar ekleniyor.
# `CFString` font adı, `CFCGTypes` ise CGPoint/CGSize/CGRect için.
# `CFAttributedString`, `CFDictionary` ve `CFArray` grapheme dizisinin
# şekillendirilmesi için (`CTLine`'ın girdisi, run'ın öznitelikleri ve run
# listesi); `CTLine` üçünü de zaten açıyor, burada adları kullandığımız için
# açıkça yazılı.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std", "CFString", "CFCGTypes", "CFAttributedString", "CFDictionary", "CFArray",
] }
# Yüklemenin macOS bildirimi (`bt-shell-macos::uploader::notify`, 037 phase-7).
# Kullanıcı onaylı bağımlılık kararı (2026-09-27): kullanımdan kalkmış
# `NSUserNotification` yerine Apple'ın desteklediği `UNUserNotificationCenter`
# — kayıt .tasks/037-ssh-ikinci-tur/phase-7.md → Uygulama Notları. Aynı objc2
# nesli (0.3.2). Varsayılan set `objc2-core-location`'ı çekiyordu; kırpma onu
# grafın dışında tutuyor. `UNNotificationTrigger` süs değil:
# `requestWithIdentifier:content:trigger:` o bayrağın arkasında.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std", "block2", "UNUserNotificationCenter", "UNNotificationContent",
    "UNNotificationRequest", "UNNotificationTrigger",
] }
# The main queue (`bt-shell-macos`) and vnode sources (`bt-shell-common`'s
# `watch`). User-approved dependency decision: .tasks/001 discussion.md →
# Karar.
dispatch2 = { version = "0.3", features = ["block2"] }
# Objective-C blocks (`RcBlock`) for `bt-shell-macos`'s completion handlers; already
# in the graph through wgpu's Metal backend and `dispatch2`.
block2 = "0.6"
# VT ayrıştırma, grid, scrollback, hasar, PTY ve okuyucu thread. bt-core onu
# KAPSÜLLER: pub API'de alacritty tipi görünmez. Kullanıcı onaylı bağımlılık
# kararı: .tasks/002-vt-motoru/discussion.md → Karar. Tek varsayılan feature
# serde'dir ve kapatılır: hiçbir yerde serialize etmiyoruz.
# Sürüm **tam** sabit (`=`): okuyucu döngüsü bu sürümün `event_loop.rs`'inin
# kopyası (`bt-core/src/reader.rs`) ve kopya onun `pub(crate)` iki sabitine
# (PTY token'ları) yaslanıyor — yama sürümü bile onları sessizce kaydırabilirdi
# (035 phase-2). vte'yi bu pin sabitlemiyor (alacritty onu `^0.15.0` istiyor):
# onun sürümünü `Cargo.lock`, `Handler`'a gelecek yeni metodu da
# sarmalayıcının `missing_trait_methods` bekçisi tutuyor.
alacritty_terminal = { version = "=0.26.0", default-features = false }
# Ayar ve tema dosyası (`bt-core::settings`). Kullanıcı onaylı bağımlılık
# kararı: .tasks/007-ayarlar-ve-tema/discussion.md → Karar. `toml` + `serde`
# yerine: menüden seçilen tema dosyaya yazılacak ve sözleşme "tanımadığını
# bırakır" diyor — serde yolu yorumu, düzeni ve bilinmeyen anahtarın yerini
# kaybeder. `parse` okuma, `display` biçim koruyan yazma (Tema menüsü, 007
# phase-7; `toml_writer`'ı çekiyor). `Cargo.lock`'taki
# `serde_core`/`serde_derive`/`syn` satırları **derlenmiyor**: `toml_datetime`'ın
# zayıf `serde_core?/std` özelliği kilit dosyasına yazdırıyor, `cargo tree -p
# bt-core` onları göstermez.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# `Handler`'ı aktaran sarmalayıcı için (`bt-core::handler`): trait'in
# `set_mouse_cursor_icon` metodu imzasında `CursorIcon` geçiriyor ve ne vte ne
# alacritty onu yeniden ihraç ediyor (vte `ansi`'de özel `use`). Aktarım
# listesinin bekçisi `clippy::missing_trait_methods` metodu atlamaya izin
# vermiyor. `polling` emsali: yeni bir crate DEĞİL — grafta zaten vardı (vte'nin
# `ansi` özelliği), aynı 1.2.0'a çözülüyor; `Cargo.lock`'ta yalnız `bt-core`'un
# bağımlılık listesine bir kenar ekleniyor. Kullanıcı kararı:
# .tasks/035-grapheme-dizileri/discussion.md → Karar.
cursor-icon = { version = "1.2", default-features = false }
# Bekçi thread'in son çaresi: `write(2, …)` + `_exit(70)`, ikisi de
# async-signal-safe (`bt-shell-macos::bekci`). Yeni bir crate DEĞİL — grafta zaten
# vardı (alacritty PTY'yi onunla açıyor) ve sürüm oynamıyor; `Cargo.lock`'ta
# yalnız `bt-shell-macos`'un bağımlılık listesine bir kenar ekleniyor. Kararın kaydı:
# .tasks/002-vt-motoru/phase-4.md → Uygulama Notları.
libc = "0.2"
# `EventedReadWrite`'ı uygulayabilmek için (`bt-core::session`'ın `TappedPty`'si):
# trait'in üç kayıt metodu imzasında `Poller`, `Event` ve `PollMode` geçiriyor ve
# alacritty bu crate'i yeniden ihraç ETMİYOR (yalnız `vte`'yi ediyor), yani
# tipleri adlandırmanın başka yolu yok. `libc` emsali: yeni bir crate DEĞİL —
# grafta zaten vardı (alacritty PTY'yi onunla yokluyor), sürüm sınırı onunkiyle
# aynı (3.8) ve aynı 3.11'e çözülüyor; `Cargo.lock`'ta yalnız `bt-core`'un
# bağımlılık listesine bir kenar ekleniyor. Kararın kaydı:
# .tasks/009-shell-entegrasyonu/phase-2.md → Uygulama Notları.
polling = "3.8"
# Dock'un sütun aritmetiği (`bt-core::dock`) ve — aynı setin ikinci
# phase'inde — bastırmanın tazelik kapısı (`bt-core::shell`). Yeni bir crate DEĞİL — grafta zaten vardı ve **ızgaranın
# kullandığının ta kendisi**: alacritty `Flags::WIDE_CHAR`'ı
# `unicode_width::UnicodeWidthChar` ile kuruyor ama onu yeniden **ihraç
# etmiyor** (ölçüldü). Aynı crate'in aynı sürümü olması kararın özü: ikinci
# bir genişlik kaynağı ızgaranınkiyle ayrıştığı gün belirtisi sessizdir —
# dock bir sütun kayar. `Cargo.lock`'ta yalnız `bt-core`'un listesine bir
# kenar ekleniyor, hiçbir sürüm oynamıyor. Kararın kaydı:
# .tasks/024-dock-sutun-aritmetigi/discussion.md → Karar 1.
unicode-width = "0.2"

# The renderer's measured move from Metal to wgpu (040). User-approved
# dependency decision (2026-09-28): .tasks/040-linux-kapisi-ve-wgpu/discussion.md
# → Karar 3 and 10. `bt-gpu`'s only GPU dependency. The feature set is kept
# narrow: `metal` is macOS's backend, `vulkan` Linux's, `wgsl` the shader
# language, `std` the native target. `dx12` (Windows is not a target), `gles`
# (on Linux we want Vulkan; a GL fallback would mean testing a second driver
# path) and `webgpu` (the web is not a target) are off; `parking_lot` would
# also come with the defaults, std's locks are enough. The Metal backend uses
# `objc2` 0.6 / `objc2-metal` 0.3 / `block2` 0.6 — the generation `bt-shell-macos`
# already pins, so no second binding stack enters the graph (context.md →
# Kanıt).
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal", "vulkan"] }

# The Linux backend of `bt-atlas`'s font system (042). User-approved
# dependency decision (2026-09-30): .tasks/042-font-sistemi-linux/discussion.md
# → Karar 5, the approval recorded in phase-4.md. Linux only — `bt-atlas`
# declares them under `cfg(target_os = "linux")`, so the macOS build and
# product graph never see them; `Cargo.lock` is target-independent and lists
# them anyway. Linked dynamically through pkg-config: `bundled` (freetype-rs)
# and `dlopen` (fontconfig) stay off — no C build on every clean build, no
# silent absence at run time. The transitive crates (freetype-sys, libz-sys,
# cc, pkg-config, yeslogic-fontconfig-sys, dlib, and the build-time vcpkg,
# shlex, find-msvc-tools) are named in the same approval.
freetype-rs = { version = "0.38", default-features = false }
fontconfig = { version = "0.11", default-features = false }
# The raw binding under `fontconfig`, for the calls the wrapper does not open
# — reading a pattern's charset and asking it for a code point (the cascade
# walk). Not a new crate: `fontconfig` already pulls it and it resolves to the
# same version (the `polling` precedent; approved with the list above).
yeslogic-fontconfig-sys = { version = "6", default-features = false }
# Grapheme-cluster shaping of the same backend (042 phase-5), approved in the
# same decision. It reads the font file's bytes the FreeType face is opened
# from, so the glyph number it gives is the drawing font's. `std` only (the
# default): `icu` would pull ICU's normaliser for composition the atlas never
# asks for (a cluster either becomes one glyph or falls back to its base
# character). Transitive: read-fonts, font-types, bytemuck, smallvec (and
# bitflags, once_cell, already in the graph).
harfrust = { version = "0.13", default-features = false, features = ["std"] }

bt-core = { path = "crates/bt-core" }
bt-atlas = { path = "crates/bt-atlas" }
bt-gpu = { path = "crates/bt-gpu" }
bt-shell-common = { path = "crates/bt-shell-common" }
bt-shell-macos = { path = "crates/bt-shell-macos" }
