[workspace]
resolver = "3"
members = [
    "crates/bt-core",
    "crates/bt-atlas",
    "crates/bt-gpu",
    "crates/bt-shell-common",
    "crates/bt-shell-macos",
    "crates/bateri",
]

[workspace.package]
version = "0.22.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

# External crate versions from one place; members say `{ workspace = true }`.
[workspace.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
# Framework crates enable every header by default; the ones used are counted.
# Trimming is here because per-member `default-features = false` cannot
# override inheritance.
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSGraphics",
    "NSRunningApplication", "NSEvent", "NSPasteboard", "objc2-core-foundation",
    "objc2-quartz-core",
] }
# Glyph rasterization (`bt-atlas`): CTFont metrics + alpha-only bitmap context.
# User-approved dependency decision. The Servo family (`core-text` 22) was rejected: a second CF wrapper
# stack would enter `Cargo.lock`, and the workspace already pins the objc2 family.
# `CTFontDescriptor` is not decoration — `CTFontGetAdvancesForGlyphs` takes its
# orientation type (`CTFontOrientation`) from there and it does not compile
# without that feature.
objc2-core-text = { version = "0.3", default-features = false, features = [
    "std", "CTFont", "CTFontDescriptor", "CTFontTraits", "objc2-core-graphics",
# `CTFontTraits` is not decoration either: the `CTFontSymbolicTraits` type and
# the `copy_with_symbolic_traits` / `symbolic_traits` gates that work with it
# are behind that feature. The four font faces (bold, italic, bold-italic)
# cannot be derived without them.
# `CTLine` + `CTRun` shape a grapheme sequence (flag, ZWJ, skin tone, VS16) into
# a single glyph — `CTFontGetGlyphsForCharacters` looks per code point and does
# not join the sequence. `CTStringAttributes` is for `kCTFontAttributeName`:
# the line's font is handed to the attributed string through it and the font
# the run actually used is read through it.
    "CTLine", "CTRun", "CTStringAttributes",
] }
# `CGBitmapContextCreate` is at the intersection of four headers (its own
# `CGBitmapContext` header + `CGColorSpace` + `CGContext` + `CGImage`), `CGFont`
# is for the `CGGlyph` type. The default feature set also pulled in
# `objc2-io-surface`; trimming keeps it out of the graph.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGFont", "CGImage",
] }
# NOT a new crate — it was already in the graph (objc2-app-kit pulls it) and the
# version does not move; in `Cargo.lock` only an edge is added to `bt-atlas`'s list.
# `CFString` is for the font name, `CFCGTypes` for CGPoint/CGSize/CGRect.
# `CFAttributedString`, `CFDictionary` and `CFArray` are for shaping the grapheme
# sequence (the input of `CTLine`, the run's attributes and the run list);
# `CTLine` already enables all three, they are written out explicitly because
# we use the names here.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std", "CFString", "CFCGTypes", "CFAttributedString", "CFDictionary", "CFArray",
] }
# The macOS notification for uploads (`bt-shell-macos::uploader::notify`).
# User-approved dependency decision (2026-09-27): Apple's supported
# `UNUserNotificationCenter` instead of the deprecated `NSUserNotification`.
# Same objc2 generation (0.3.2). The default set pulled in `objc2-core-location`; trimming
# keeps it out of the graph. `UNNotificationTrigger` is not decoration:
# `requestWithIdentifier:content:trigger:` is behind that flag. Nor is
# `UNNotification`: the center's delegate is asked about a notification in front
# by that type (`uploader::Presenter`); it needs only `objc2-foundation`'s
# `NSDate` and `NSObject`, no new crate.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std", "block2", "UNUserNotificationCenter", "UNNotificationContent",
    "UNNotificationRequest", "UNNotificationTrigger", "UNNotification",
] }
# The Keychain of bateri's ssh masters (`bt-shell-macos::keychain`):
# `SecItem*` over an internet password. User-approved dependency decision
# (2026-10-02): the objc2 family's own generation (0.3.2) instead of a second CF
# wrapper stack (`security-framework`) or hand-written FFI. Its only edge is
# `objc2-core-foundation`, already in the graph; the error codes are named in
# the module rather than turning on the `SecBase` header.
objc2-security = { version = "0.3.2", default-features = false, features = [
    "std", "SecItem",
] }
# The web view a program's view runs in (`bt-shell-macos::pencere_view`): `WKWebView`
# with a custom URL scheme served by the application, a script-message bridge to the
# host's conversation with the program, and navigation and UI delegates that refuse
# everything else. User-approved dependency decision (2026-10-21): the objc2 family's
# own generation (0.3.2), the only new crate of the pane's view; `bitflags` is already
# in the graph and the framework crates it names (`objc2-app-kit`, `objc2-foundation`,
# `block2`) are the ones the shell already links. The default set turns on every
# WebKit header; the flags below are the classes the module names.
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration",
    "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler",
    "WKURLSchemeHandler", "WKURLSchemeTask", "WKNavigationDelegate", "WKNavigationAction",
    "WKNavigation", "WKUIDelegate", "WKWebsiteDataStore", "WKFrameInfo", "WKSecurityOrigin",
    "WKWindowFeatures",
# `WKSnapshotConfiguration`: the web view's own picture for the tab card's tile
# (`pencere_view::still`) — the rectangle and the width of what it gives back;
# its rectangle is a `CGRect`, behind the `objc2-core-foundation` flag.
    "WKSnapshotConfiguration", "objc2-core-foundation",
] }
# The main queue (`bt-shell-macos`) and vnode sources (`bt-shell-common`'s
# `watch`). User-approved dependency decision.
dispatch2 = { version = "0.3", features = ["block2"] }
# Objective-C blocks (`RcBlock`) for `bt-shell-macos`'s completion handlers; already
# in the graph through wgpu's Metal backend and `dispatch2`.
block2 = "0.6"
# VT parsing, grid, scrollback, damage, PTY and the reader thread. bt-core
# ENCAPSULATES it: no alacritty type appears in the pub API. User-approved
# dependency decision. The only
# default feature is serde and it is turned off: we serialize nowhere.
# The version is pinned **exactly** (`=`): the reader loop is a copy of this
# version's `event_loop.rs` (`bt-core/src/reader.rs`) and the copy leans on its
# two `pub(crate)` constants (the PTY tokens) — even a patch release could
# silently shift them. The pin holds vte as well, through the fork below
# (alacritty asks for `^0.15.0`, the fork is that version), and a new method that
# arrives in `Handler` is caught by the wrapper's `missing_trait_methods` guard.
alacritty_terminal = { version = "=0.26.0", default-features = false }
# Settings and theme files (`bt-core::settings`). User-approved dependency
# decision. Instead of `toml` +
# `serde`: the theme chosen from the menu will be written to the file and the
# contract says "leaves what it does not recognize" — the serde path loses
# comments, layout and the place of unknown keys. `parse` is reading, `display`
# is format-preserving writing (Theme menu; it pulls in
# `toml_writer`). The `serde_core`/`serde_derive`/`syn` lines in `Cargo.lock`
# are **not compiled**: `toml_datetime`'s weak `serde_core?/std` feature makes
# them get written to the lock file, `cargo tree -p bt-core` does not show them.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# For the wrapper that forwards `Handler` (`bt-core::handler`): the trait's
# `set_mouse_cursor_icon` method passes `CursorIcon` in its signature and neither
# vte nor alacritty re-exports it (a private `use` in vte's `ansi`). The guard of
# the forwarding list, `clippy::missing_trait_methods`, does not allow skipping a
# method. `polling` precedent: NOT a new crate — it was already in the graph
# (vte's `ansi` feature), resolves to the same 1.2.0; in `Cargo.lock` only an edge
# is added to `bt-core`'s dependency list. User decision.
cursor-icon = { version = "1.2", default-features = false }
# The last resort of the watchdog thread: `write(2, …)` + `_exit(70)`, both
# async-signal-safe (`bt-shell-macos::bekci`). NOT a new crate — it was already in the
# graph (alacritty opens the PTY with it) and the version does not move; in `Cargo.lock`
# only an edge is added to `bt-shell-macos`'s dependency list. The same edge is
# in `bt-core`'s list for the kitty graphics protocol's shared memory
# (`graphics::source`: `shm_open`, `shm_unlink` and, on macOS, `mmap`, none of
# which std offers) and for opening a named file without blocking on a pipe
# (`O_NONBLOCK`, `O_NOFOLLOW`). The Unix PTY's `libc` is the one the layer
# contract allows `bt-core` (`lib.rs`); no version moves.
libc = "0.2"
# To be able to implement `EventedReadWrite` (`bt-core::session`'s `TappedPty`):
# the trait's three registration methods pass `Poller`, `Event` and `PollMode` in
# their signature and alacritty does NOT re-export this crate (it only does so for
# `vte`), so there is no other way to name the types. `libc` precedent: NOT a new
# crate — it was already in the graph (alacritty polls the PTY with it), the
# version bound is the same as its (3.8) and it resolves to the same 3.11; in
# `Cargo.lock` only an edge is added to `bt-core`'s dependency list.
polling = "3.8"
# The dock's column arithmetic (`bt-core::dock`) and the suppression's
# freshness gate (`bt-core::shell`). NOT a new
# crate — it was already in the graph and is **the very one the grid uses**:
# alacritty sets `Flags::WIDE_CHAR` with `unicode_width::UnicodeWidthChar` but
# does **not re-export** it (measured). Being the same version of the same crate
# is the heart of the decision: the day a second width source diverges from the
# grid's the symptom is silent — the dock shifts by a column. In `Cargo.lock`
# only an edge is added to `bt-core`'s list, no version moves.
unicode-width = "0.2"
# The kitty graphics protocol's image payloads (`bt-core::graphics`): `png`
# decodes `f=100` (what `kitten icat` sends) and `miniz_oxide` inflates `o=z`.
# User-approved dependency decision (2026-10-13): pure Rust (the Linux gate
# does not change), MIT/Apache/Zlib licensed (GPL-3 compatible), and writing our
# own PNG or inflate was rejected. `miniz_oxide` is NOT a second inflate: it
# is the one `png` pulls in (same 0.8 line), named directly because `png`
# does not re-export it and `o=z` data is not a PNG stream.
png = "0.18"
miniz_oxide = "0.8"

# The renderer's measured move from Metal to wgpu. User-approved
# dependency decision (2026-09-28). `bt-gpu`'s only GPU dependency. The feature set is kept
# narrow: `metal` is macOS's backend, `vulkan` Linux's, `wgsl` the shader
# language, `std` the native target. `dx12` (Windows is not a target), `gles`
# (on Linux we want Vulkan; a GL fallback would mean testing a second driver
# path) and `webgpu` (the web is not a target) are off; `parking_lot` would
# also come with the defaults, std's locks are enough. The Metal backend uses
# `objc2` 0.6 / `objc2-metal` 0.3 / `block2` 0.6 — the generation `bt-shell-macos`
# already pins, so no second binding stack enters the graph.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal", "vulkan"] }

# The Linux backend of `bt-atlas`'s font system. User-approved
# dependency decision (2026-09-30). Linux only — `bt-atlas`
# declares them under `cfg(target_os = "linux")`, so the macOS build and
# product graph never see them; `Cargo.lock` is target-independent and lists
# them anyway. Linked dynamically through pkg-config: `bundled` (freetype-rs)
# and `dlopen` (fontconfig) stay off — no C build on every clean build, no
# silent absence at run time. The transitive crates (freetype-sys, libz-sys,
# cc, pkg-config, yeslogic-fontconfig-sys, dlib, and the build-time vcpkg,
# shlex, find-msvc-tools) are named in the same approval.
freetype-rs = { version = "0.38", default-features = false }
fontconfig = { version = "0.11", default-features = false }
# The raw binding under `fontconfig`, for the calls the wrapper does not open
# — reading a pattern's charset and asking it for a code point (the cascade
# walk). Not a new crate: `fontconfig` already pulls it and it resolves to the
# same version (the `polling` precedent; approved with the list above).
yeslogic-fontconfig-sys = { version = "6", default-features = false }
# Grapheme-cluster shaping of the same backend, approved in the
# same decision. It reads the font file's bytes the FreeType face is opened
# from, so the glyph number it gives is the drawing font's. `std` only (the
# default): `icu` would pull ICU's normaliser for composition the atlas never
# asks for (a cluster either becomes one glyph or falls back to its base
# character). Transitive: read-fonts, font-types, bytemuck, smallvec (and
# bitflags, once_cell, already in the graph).
harfrust = { version = "0.13", default-features = false, features = ["std"] }

# The kablo protocol: the wire format `bt-shell-common::kablo` speaks to a server's relay
# (frames, handshake, messages, and the rules for installing the binary there). Taken from
# kablo's repository by the same pinned commit as the two forks below, so that one `rev`
# is the only place bateri names a kablo version — and moving it is the one way a change in
# kablo reaches bateri. User-approved dependency decision (2026-10-19): the protocol is
# written once, in kablo, and bateri is a client of it; rewriting it here would be a second
# copy that drifts. The crate has no dependencies of its own and the same license as
# bateri (GPL-3.0-or-later); `make audit` fails if the three do not resolve to one commit.
kablo-proto = { git = "https://github.com/bateri/kablo", rev = "297cc8c6d85118669e9db556965da38eb121ff2a" }

# pencere: the protocol a program in a pane speaks to show its view there, and the kit its
# native views are made with, from its own repository and one pinned commit, like
# `kablo-proto`: the rules and the engine are written once, in pencere, and bateri is a host of
# them; rewriting them here would be a second copy that drifts. Four crates, one `rev`:
#
# - `pencere-host`: frames, messages, the session's rules, bundles, the content security
#   policy and the context a page is told, as a crate with no I/O. It brings `serde`,
#   `serde_json` and `sha2` into the graph (user-approved dependency decision, 2026-10-21).
# - `pencere-view`: the page engine of a native view (tree of boxes and text, layout as
#   flexbox and grid, draw list). Its only dependency is `taffy` (MIT; slotmap, grid and
#   arrayvec behind it).
# - `pencere-sandbox`: the WebAssembly runtime and the Lua interpreter a native view runs in,
#   and the decoders of the pictures a page shows (PNG, JPEG, SVG). It brings `wasmtime`,
#   `png`, `zune-jpeg` and `resvg` into the graph. User-approved dependency decisions: the
#   runtime on 2026-10-23, with the `allow-jit` entitlement it needs under the hardened
#   runtime; the three picture formats on 2026-10-24. It takes `regex` as well, the one the
#   editor brings (below), to refuse a page whose editor's rules are not patterns where both
#   kinds of page pass; no crate comes into the graph with it.
# - `pencere-editor`: the editor of text a page puts in its room (`Element::editor`) — the
#   document, its selections and history, what an input method composes, laid out and drawn
#   by the host. It brings `ropey` (MIT; `str_indices` behind it), `unicode-segmentation` (MIT
#   or Apache-2.0) and `regex` (MIT or Apache-2.0; `regex-automata` and `regex-syntax` are in
#   the graph already) into the graph. User-approved dependency decision (2026-10-27): the
#   editor is the kit's, and a page's editor has to be the same in every host.
#
# All of pencere is Apache-2.0 (GPL-3 compatible), and `rev` must be a commit at or after the
# relicensing (`75a78e3`). `make audit` fails if `rev` is not a full hash or does not resolve,
# and if any of the four comes from anywhere else.
pencere-host = { git = "https://github.com/bateri/pencere", rev = "777f921ae6b5f666450fc8023b53ca618ea2748c" }
pencere-view = { git = "https://github.com/bateri/pencere", rev = "777f921ae6b5f666450fc8023b53ca618ea2748c" }
pencere-sandbox = { git = "https://github.com/bateri/pencere", rev = "777f921ae6b5f666450fc8023b53ca618ea2748c" }
pencere-editor = { git = "https://github.com/bateri/pencere", rev = "777f921ae6b5f666450fc8023b53ca618ea2748c" }
# And the program's side of the same protocol (`pencere`, the library of pencere's `program/`),
# at the same `rev`, as a **dev**-dependency of `bt-core` alone: the program the end-to-end tests
# of a pane run in it (`crates/bt-core/examples/demopen.rs`). It ships nowhere. It brings no crate
# the build does not have already (`serde`, `serde_json`, `libc` and `pencere-wire`).
pencere = { git = "https://github.com/bateri/pencere", rev = "777f921ae6b5f666450fc8023b53ca618ea2748c" }
serde_json = "1"

bt-core = { path = "crates/bt-core" }
bt-atlas = { path = "crates/bt-atlas" }
bt-gpu = { path = "crates/bt-gpu" }
bt-shell-common = { path = "crates/bt-shell-common" }
bt-shell-macos = { path = "crates/bt-shell-macos" }

# `vte`, the parser inside `alacritty_terminal`, is a fork: upstream 0.15.0 plus the changes
# listed in its `FORK.md`. It lives in kablo's repository (`vendor/vte`), because the relay
# there parses with the same source; bateri takes it by a pinned commit (`rev`), and moving
# `rev` is the one way a change to the fork reaches bateri — the commit has to be pushed
# first. User-approved dependency decision (2026-10-13): vte 0.15.0 drops the byte after a
# character that a read cut in two and swallows application program commands
# (`ESC _ … ESC \`) without telling the handler; the fork fixes the first and passes the
# second on, with a way to halt the parser right after a command. It also hands the pointer
# shape request (OSC 22) on as written: upstream reads a single name, and kitty's protocol
# (reset, push/pop, query) is more. Same name and version, so `alacritty_terminal` resolves
# to it unchanged; when it asks for a newer vte the fork is carried over by hand
# (`FORK.md` says how), and `make audit` fails if the patch stops applying — cargo only
# warns, then quietly builds the registry's vte.
#
# `alacritty_terminal` is a fork too, from the same repository and at the same `rev`
# (`vendor/alacritty_terminal`, its own `FORK.md`): upstream 0.26.0 plus a read-only way to
# look at the primary screen while a program holds the alternate one, so the output of the
# commands that ran before a full screen program can still be copied. It only adds; the name
# and version are upstream's, so the exact `=0.26.0` pin above resolves to it. User-approved
# dependency decision (2026-10-17, the command palette): the same care as vte's — `make audit`
# fails if the patch stops applying, and a newer upstream release is merged by hand.
[patch.crates-io]
vte = { git = "https://github.com/bateri/kablo", rev = "297cc8c6d85118669e9db556965da38eb121ff2a" }
alacritty_terminal = { git = "https://github.com/bateri/kablo", rev = "297cc8c6d85118669e9db556965da38eb121ff2a" }

# On macOS the default development profile keeps full debug info in object files beside every
# build ("unpacked") and never removes the ones a rebuild replaces: each edit at the bottom
# crate left about 2 600 more of them, and a busy checkout grew past 100 GB in a few days.
# Line tables with split debug info off keep nothing beside the build and roughly halve a
# rebuild; the price is that a backtrace's frames carry function names but no file:line (a
# panic's own message still says where). For a run that needs them, override from the
# environment: `CARGO_PROFILE_DEV_SPLIT_DEBUGINFO=packed` (slower links, full lines).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

# A page module is compiled to machine code when its page opens, by the sandbox's code
# generator; built without optimization (a debug build) that takes seconds and the page is
# not there while it does. The generator and what feeds it are optimized in the development
# profile too — compiled once, cached with the rest.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2
