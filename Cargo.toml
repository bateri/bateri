[workspace]
resolver = "3"
members = [
    "crates/bt-core",
    "crates/bt-atlas",
    "crates/bt-gpu",
    "crates/bt-shell",
    "crates/bateri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

# Dış crate sürümleri tek yerden; üyeler `{ workspace = true }` der.
[workspace.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
# Framework crate'leri varsayılanda her başlığı açar; kullanılanlar sayılır.
# Üye başına `default-features = false` mirası ezemediği için kırpma burada.
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSGraphics",
    "NSRunningApplication", "NSEvent", "NSPasteboard", "objc2-core-foundation",
    "objc2-quartz-core",
] }
# Glyph rasterizasyonu (`bt-atlas`): CTFont metriği + alfa-only bitmap bağlamı.
# Kullanıcı onaylı bağımlılık kararı: .tasks/003-glyph-atlas/discussion.md →
# Karar. Servo ailesi (`core-text` 22) reddedildi: ikinci bir CF sarmalayıcı
# yığını `Cargo.lock`'a girerdi, workspace zaten objc2 ailesini pinliyor.
# `CTFontDescriptor` süs değil — `CTFontGetAdvancesForGlyphs` yönelim tipini
# (`CTFontOrientation`) oradan alıyor ve o feature olmadan derlenmiyor.
objc2-core-text = { version = "0.3", default-features = false, features = [
    "std", "CTFont", "CTFontDescriptor", "CTFontTraits", "objc2-core-graphics",
# `CTFontTraits` da süs değil: `CTFontSymbolicTraits` tipi ve onunla çalışan
# `copy_with_symbolic_traits` / `symbolic_traits` kapıları o feature'ın
# arkasında. Dört font yüzü (kalın, eğik, kalın-eğik) onlarsız türetilemiyor.
] }
# `CGBitmapContextCreate` dört başlığın kesişiminde (kendi `CGBitmapContext`
# başlığı + `CGColorSpace` + `CGContext` + `CGImage`), `CGFont` ise `CGGlyph`
# tipi için. Varsayılan feature seti `objc2-io-surface`'i de çekiyordu;
# kırpma onu grafın dışında tutuyor.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGFont", "CGImage",
] }
# Yeni bir crate DEĞİL — grafta zaten vardı (objc2-app-kit çekiyor) ve sürüm
# oynamıyor; `Cargo.lock`'ta yalnız `bt-atlas`'ın listesine kenar ekleniyor.
# `CFString` font adı, `CFCGTypes` ise CGPoint/CGSize/CGRect için.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std", "CFString", "CFCGTypes",
] }
# DispatchData kurucuları `block2` feature'ının arkasında; objc2-metal bunu
# açmaz. Kullanıcı onaylı bağımlılık kararı: .tasks/001 discussion.md → Karar.
dispatch2 = { version = "0.3", features = ["block2"] }
# `addCompletedHandler:` bir ObjC bloğu ister; `RcBlock` onu yığında tutar.
# Grafta zaten vardı (objc2-metal'in varsayılan `block2` feature'ı çekiyor),
# bu satır yalnız adını kullanılabilir kılar — Cargo.lock oynamaz.
block2 = "0.6"
# VT ayrıştırma, grid, scrollback, hasar, PTY ve okuyucu thread. bt-core onu
# KAPSÜLLER: pub API'de alacritty tipi görünmez. Kullanıcı onaylı bağımlılık
# kararı: .tasks/002-vt-motoru/discussion.md → Karar. Tek varsayılan feature
# serde'dir ve kapatılır: hiçbir yerde serialize etmiyoruz.
alacritty_terminal = { version = "0.26", default-features = false }
# Ayar ve tema dosyası (`bt-core::settings`). Kullanıcı onaylı bağımlılık
# kararı: .tasks/007-ayarlar-ve-tema/discussion.md → Karar. `toml` + `serde`
# yerine: menüden seçilen tema dosyaya yazılacak ve sözleşme "tanımadığını
# bırakır" diyor — serde yolu yorumu, düzeni ve bilinmeyen anahtarın yerini
# kaybeder. `parse` okuma, `display` biçim koruyan yazma (Tema menüsü, 007
# phase-7; `toml_writer`'ı çekiyor). `Cargo.lock`'taki
# `serde_core`/`serde_derive`/`syn` satırları **derlenmiyor**: `toml_datetime`'ın
# zayıf `serde_core?/std` özelliği kilit dosyasına yazdırıyor, `cargo tree -p
# bt-core` onları göstermez.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# Bekçi thread'in son çaresi: `write(2, …)` + `_exit(70)`, ikisi de
# async-signal-safe (`bt-shell::bekci`). Yeni bir crate DEĞİL — grafta zaten
# vardı (alacritty PTY'yi onunla açıyor) ve sürüm oynamıyor; `Cargo.lock`'ta
# yalnız `bt-shell`'in bağımlılık listesine bir kenar ekleniyor. Kararın kaydı:
# .tasks/002-vt-motoru/phase-4.md → Uygulama Notları.
libc = "0.2"
# `EventedReadWrite`'ı uygulayabilmek için (`bt-core::session`'ın `TappedPty`'si):
# trait'in üç kayıt metodu imzasında `Poller`, `Event` ve `PollMode` geçiriyor ve
# alacritty bu crate'i yeniden ihraç ETMİYOR (yalnız `vte`'yi ediyor), yani
# tipleri adlandırmanın başka yolu yok. `libc` emsali: yeni bir crate DEĞİL —
# grafta zaten vardı (alacritty PTY'yi onunla yokluyor), sürüm sınırı onunkiyle
# aynı (3.8) ve aynı 3.11'e çözülüyor; `Cargo.lock`'ta yalnız `bt-core`'un
# bağımlılık listesine bir kenar ekleniyor. Kararın kaydı:
# .tasks/009-shell-entegrasyonu/phase-2.md → Uygulama Notları.
polling = "3.8"

bt-core = { path = "crates/bt-core" }
bt-atlas = { path = "crates/bt-atlas" }
bt-gpu = { path = "crates/bt-gpu" }
bt-shell = { path = "crates/bt-shell" }
